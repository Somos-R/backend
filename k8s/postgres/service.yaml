apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: somos-r-prod
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ConfigMap with PostGIS initialization SQL
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: somos-r-prod
data:
  init-db.sql: |
    CREATE EXTENSION IF NOT EXISTS postgis;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
