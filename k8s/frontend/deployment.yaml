apiVersion: apps/v1
kind: Deployment
metadata:
  name: somos-r-frontend
  namespace: somos-r-prod
  labels:
    app: somos-r-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: somos-r-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: somos-r-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/somos-r/frontend:latest
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
