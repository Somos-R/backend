name: Security

# Three independent checks. They also run every Monday: new CVEs are published against
# code that has not changed, so a green PR last month says nothing about today.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned tools; Dependabot proposes bumps for the tags in this file.
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.21.2
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  # ─── Known vulnerabilities in Python dependencies ─────────────────────────
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry>=2.0.0,<3.0.0"

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      # Fails on any known vulnerability. A finding with no fix yet can be accepted explicitly
      # with `--ignore-vuln <ID>` here, with a comment saying why and until when.
      - name: pip-audit
        run: poetry run pip-audit --progress-spinner off

  # ─── Secrets committed to the repository (full history) ───────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still leaked

      # Run the tool image directly (the gitleaks GitHub Action needs a paid licence for organizations).
      # Accepted false positives live in .gitleaksignore, by exact fingerprint.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" detect --source /repo --redact --no-banner --exit-code 1

  # ─── Vulnerabilities in the production image ──────────────────────────────
  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          load: true
          push: false
          tags: somos-r-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # HIGH/CRITICAL with an available fix. Unfixed findings are ignored: nothing can be done
      # about them yet, and they would block every PR.
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress somos-r-backend:scan
