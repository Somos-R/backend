name: CI — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the build job asks for `packages: write` itself.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/somos-r/backend

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      # tests/conftest.py drops and recreates this database on every run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos_r_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use-0123456789
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry>=2.0.0,<3.0.0"

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check app tests

      - name: Type check (mypy)
        run: poetry run mypy app

      - name: Run tests
        run: poetry run pytest --tb=short -q --cov --cov-report=term-missing

  # ─── Build image (smoke test — not pushed anywhere for deployment yet) ────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          # Only publish the image once it's actually on main — PRs just
          # need the build itself to succeed, that's what's required to merge.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Deployment is not wired up here yet. The plan is Railway (backend) + Vercel
# (web) + Supabase (Postgres/PostGIS) — see ESTADO_Y_PLAN_MVP.md — connected
# straight to GitHub, not a Kubernetes cluster. Add that as its own step once
# the Railway project exists.
