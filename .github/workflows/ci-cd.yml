name: CI — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the build job asks for `packages: write` itself.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/somos-r/backend

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      # tests/conftest.py drops and recreates this database on every run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos_r_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use-0123456789
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry>=2.0.0,<3.0.0"

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check app tests

      - name: Type check (mypy)
        run: poetry run mypy app

      - name: Run tests
        run: poetry run pytest --tb=short -q --cov --cov-report=term-missing

  # ─── Build image (smoke test — not pushed anywhere for deployment yet) ────
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.prod
          # Only publish the image once it's actually on main — PRs just
          # need the build itself to succeed, that's what's required to merge.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Deployment is not wired up here yet. The plan is Railway (backend) + Vercel
# (web) + Supabase (Postgres/PostGIS) — see ESTADO_Y_PLAN_MVP.md — connected
# straight to GitHub, not a Kubernetes cluster. Add that as its own step once
# the Railway project exists.
