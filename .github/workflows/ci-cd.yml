name: CI — Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/somos-r/backend

jobs:
  # ─── Tests ────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      # Settings() requires these; no real DB is needed until tests hit one.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/somos_r_test
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry>=2.0.0,<3.0.0"

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run tests
        run: poetry run pytest --tb=short -q
        continue-on-error: true   # Don't fail the run until there are real tests to fail on

  # ─── Build image (smoke test — not pushed anywhere for deployment yet) ────
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Deployment is not wired up here yet. The plan is Railway (backend) + Vercel
# (web) + Supabase (Postgres/PostGIS) — see ESTADO_Y_PLAN_MVP.md — connected
# straight to GitHub, not a Kubernetes cluster. Add that as its own step once
# the Railway project exists.
