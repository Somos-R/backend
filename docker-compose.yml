# Entorno de DESARROLLO. No usar en un servidor: en producción la base y el backend van gestionados
# (Supabase / Railway) y las credenciales salen de variables de entorno, no de este archivo.
#
# Las credenciales se leen del archivo `.env` (junto a este archivo; ver .env.example). Si no existe,
# se usan los valores por defecto de desarrollo. Todos los puertos quedan publicados SOLO en
# 127.0.0.1: nadie más en tu red puede llegar a la base, a pgAdmin ni a la API.
#
# OJO: Postgres fija su contraseña al crear el volumen la primera vez. Si cambias POSTGRES_PASSWORD
# después, hay que recrear el volumen (`docker compose down -v`, borra los datos) o cambiarla con ALTER USER.

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: somos-r-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-somos_r_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-somos_r_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somos-r-network

  # pgAdmin (opcional): interfaz gráfica para ver la DB. No arranca por defecto; se activa con
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: somos-r-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@somosr.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - somos-r-network

  # Nuestro servicio (Backend)
  app:
    build: .  # Usa el Dockerfile de desarrollo (Dockerfile.prod es la imagen de producción)
    container_name: somos-r-backend
    volumes:
      - .:/app  # Sincroniza tu código para ver cambios en tiempo real
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-somos_r_dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - somos-r-network
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  somos-r-network:
    driver: bridge
