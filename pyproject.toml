[project]
name = "somos-r-backend"
version = "0.1.0"
description = "Backend API for Somos R recycling platform"
authors = [
    {name = "Oscar Mauricio Garcia Mesa"}
]
requires-python = "^3.11"
dependencies = [
    "fastapi (>=0.135.3,<0.143.0)",
    "uvicorn[standard] (>=0.44.0,<0.55.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "geoalchemy2 (>=0.19.0,<0.21.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.31,<0.1.0)",
    "email-validator (>=2.2,<3)",
    "httpx (>=0.28.1,<0.29)",
    "slowapi (>=0.1.9,<0.2)",
    "pyjwt (>=2.9,<3)",
    "sentry-sdk (>=2.20,<3)",
    "prometheus-client (>=0.21,<1)",
    "cryptography (>=50.0.1,<51.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=6.0.0,<8.0.0)",
    "ruff (>=0.9.0,<1.0.0)",
    "mypy (>=1.13.0,<3.0.0)",
    "pip-audit (>=2.7,<3)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/domains/*/docs.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/"]
plugins = ["pydantic.mypy"]
